<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HM Korozyon - Saha Tutanağı</title>
<link rel="icon" type="image/png" href="icons/favicon.png">
<script src="ayar.js"></script>
<style>
  @page { size: A4; margin: 8mm 8mm 11mm 8mm; }
  :root { --c: #1d2b78; --k: #c62828; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e6e9f0; font-family: Arial, Helvetica, sans-serif; color: #111; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .arac { position: sticky; top: 0; z-index: 10; background: #002595; color: #fff; padding: 10px 12px; display: flex; gap: 8px;
          justify-content: center; align-items: center; flex-wrap: wrap; border-bottom: 3px solid #F26722; font-size: 14px; }
  .arac button { font: inherit; font-weight: 700; border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; background: #fff; color: #002595; }
  .arac button.ana { background: #F26722; color: #fff; }
  .arac .pb { color: #fff; font-weight: 700; border-radius: 8px; padding: 9px 12px; text-decoration: none; display: none; }
  .durum { text-align: center; padding: 40px 16px; font-size: 17px; color: #333; }

  /* ekranda tek uzun kâğıt; yazdırırken üst (giriş) ve alt (imza) bölümleri HER SAYFADA aynı yerde */
  .sayfa { position: relative; width: 194mm; margin: 14px auto; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
  .filigran { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 0; }
  .filigran img { width: 150mm; opacity: .09; }
  .iptal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 3; }
  .iptal span { font-size: 64pt; font-weight: 900; color: rgba(198,40,40,.35); border: 6px solid rgba(198,40,40,.35); padding: 4mm 10mm; transform: rotate(-28deg); }
  .bolum { position: relative; z-index: 1; background: transparent; }
  .kalip { width: 100%; border-collapse: collapse; position: relative; z-index: 1; }
  .kalip > thead > tr > td, .kalip > tfoot > tr > td, .kalip > tbody > tr > td { border: 0; padding: 0; }
  .bosluk { display: none; }

  table { border-collapse: collapse; width: 100%; }
  td, th { border: 1.2px solid var(--c); padding: 1.6mm 2mm; vertical-align: top; font-size: 9.5pt; }
  .et { color: var(--c); font-weight: 700; font-size: 8.5pt; white-space: nowrap; background: rgba(29,43,120,.04); }
  .bant { text-align: center; font-weight: 700; color: var(--c); font-size: 9.5pt; letter-spacing: .3px; padding: 1.4mm; background: rgba(29,43,120,.06); }

  .ust td { vertical-align: middle; }
  .logo { width: 62mm; padding: 1.5mm 2mm; }
  .logo-kutu { display: flex; align-items: center; gap: 2.5mm; border: 1px solid var(--c); padding: 1mm 1.5mm; }
  .logo-kutu img { width: 15mm; height: 15mm; }
  .logo-kutu .ad { font-weight: 900; color: var(--c); letter-spacing: 1.6px; font-size: 10.5pt; border-bottom: 1px solid var(--c); padding-bottom: .6mm; margin-bottom: .6mm; }
  .logo-kutu .alt { font-size: 5.8pt; color: var(--c); font-weight: 700; line-height: 1.35; }
  .tur { font-weight: 700; color: var(--c); font-size: 10.5pt; white-space: nowrap; }
  .kutu { display: inline-block; width: 6.5mm; height: 6.5mm; border: 1.4px solid var(--c); vertical-align: middle; margin-left: 2mm;
          text-align: center; line-height: 6mm; font-weight: 900; font-size: 11pt; color: #111; }
  .tarih { font-size: 9pt; color: var(--c); }
  .tarih b { color: #111; font-weight: 700; }
  .no { text-align: right; white-space: nowrap; }
  .no span { color: var(--c); font-weight: 700; font-size: 12pt; }
  .no b { color: var(--k); font-size: 14pt; letter-spacing: 1px; font-family: "Courier New", monospace; }
  .bilgiT td { height: 6.6mm; }
  .tek { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 0; }
  .adres div { max-height: 17mm; overflow: hidden; }

  .yapilan { height: 58mm; padding: 2.5mm 3mm; border-top: 0; }
  .yapilan h3 { margin: 0 0 2mm; text-align: center; font-size: 11pt; text-decoration: underline; }
  .liste { columns: 2; column-gap: 8mm; font-size: 9.5pt; margin: 0; padding-left: 4mm; }
  .liste li { break-inside: avoid; margin-bottom: 1mm; }
  .bilgi { font-size: 9pt; margin-top: 2.5mm; line-height: 1.45; }
  .bilgi b { color: var(--c); }
  .olcT { margin-top: -1.2px; }
  .olcT thead { display: table-header-group; }
  .olcT th { color: var(--c); font-size: 8.5pt; text-align: left; background: rgba(29,43,120,.06); }
  .olcT td { padding: 1mm 2mm; font-size: 9pt; }
  .olcT .onok { color: var(--c); font-weight: 700; }
  .olcT .oref { color: #555; font-size: 8pt; }
  .malz { margin-top: -1.2px; }
  .malz thead { display: table-header-group; }
  .malz th { color: var(--c); font-size: 8.5pt; text-align: left; background: rgba(29,43,120,.06); }
  .malz td { height: 6.6mm; padding: 1mm 2mm; }
  .malz .s { text-align: right; white-space: nowrap; }
  tr { break-inside: avoid; page-break-inside: avoid; }
  .imza { margin-top: -1.2px; }
  .imza td { width: 33.33%; }
  .imza .bas { text-align: center; font-weight: 700; color: var(--c); font-size: 9pt; padding: 1.4mm; background: rgba(29,43,120,.06); }
  .imza .alan { height: 26mm; position: relative; }
  .imza .kim { position: absolute; left: 2mm; right: 2mm; bottom: 1.5mm; font-size: 8pt; color: #555; line-height: 1.6; }
  .imza .kim b { color: #111; }
  .imza .trh { font-size: 8.5pt; color: var(--c); padding: 1.3mm 2mm; }
  .imza .trh b { color: #111; }
  .dip { font-size: 7.2pt; color: #444; padding: 1.5mm 1mm 0; line-height: 1.4; }
  .dip b { color: var(--c); }

  @media print {
    body { background: #fff; }
    .arac, .durum { display: none !important; }
    .sayfa { margin: 0; box-shadow: none; width: auto; transform: none !important; }
    .filigran, .iptal { position: fixed; }
    .ustSabit { position: fixed; top: 0; left: 0; right: 0; }
    .altSabit { position: fixed; bottom: 0; left: 0; right: 0; }
    .bosluk { display: block; }
  }
</style>
</head>
<body>
<div class="arac" id="arac">
  <button id="geriBtn" style="display:none" onclick="history.length > 1 ? history.back() : (location.href = 'index.html')">‹ Uygulama</button>
  <span id="aracBaslik">HM Korozyon - Saha Tutanağı</span>
  <button class="ana" id="pdfGonderBtn" style="display:none" onclick="pdfIste('gonder')">📄 PDF gönder</button>
  <button id="pdfAcBtn" style="display:none" onclick="pdfIste('ac')">PDF aç</button>
  <button class="ana" id="yazdirBtn" onclick="window.print()">🖨 Yazdır / PDF</button>
  <a class="pb" id="gWa" target="_blank" rel="noopener" style="background:#1fa855">WhatsApp</a>
  <a class="pb" id="gSms" style="background:#3550c8">SMS</a>
  <a class="pb" id="gEp" style="background:#F26722">E-posta</a>
  <button onclick="linkKopyala()">🔗 Linki kopyala</button>
</div>
<div id="durum" class="durum">Tutanak yükleniyor…</div>
<div id="sayfa" class="sayfa" style="display:none"></div>

<script>
const $ = id => document.getElementById(id);
const tire = s => String(s === null || s === undefined ? '' : s).replace(/[\u2012\u2013\u2014\u2015\u2212]/g, '-');   // tutanakta uzun tire yok
function esc(s) { return tire(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function sayi(v) { return (v === '' || v === null || v === undefined) ? '' : String(Math.round(Number(v) * 1000) / 1000).replace('.', ','); }
const BIRIM = { m: 'm', kg: 'kg', adet: 'ad.', ad: 'ad.', set: 'set', km: 'km', 'm²': 'm²', lt: 'lt', mV: 'mV', V: 'V' };
function birim(b) { const k = String(b || '').trim(); return BIRIM[k] || k; }
function linkKopyala() {
  const u = location.href;
  if (navigator.clipboard) navigator.clipboard.writeText(u).then(() => bilgi('Link kopyalandı.'), () => bilgi(u)); else bilgi(u);
}
let bilgiZaman = null;
function bilgi(t, sure) {
  $('aracBaslik').textContent = t; clearTimeout(bilgiZaman);
  bilgiZaman = setTimeout(() => { $('aracBaslik').textContent = 'HM Korozyon - Saha Tutanağı'; }, sure || 2500);
}
const UYGULAMA = !!(window.HMAndroid && window.HMAndroid.pdf);   // HM Saha APK (PDF üretip paylaşabilen sürüm)
if (/HMSahaApp/.test(navigator.userAgent)) $('yazdirBtn').style.display = 'none';   // telefonda yazdırma yok: PDF düğmeleri var
if (UYGULAMA) ['pdfGonderBtn', 'pdfAcBtn', 'geriBtn'].forEach(id => { $(id).style.display = 'inline-block'; });
let T = null;
function ascii(s) {
  return tire(s).replace(/ğ/g, 'g').replace(/Ğ/g, 'G').replace(/ü/g, 'u').replace(/Ü/g, 'U').replace(/ş/g, 's').replace(/Ş/g, 'S')
    .replace(/ı/g, 'i').replace(/İ/g, 'I').replace(/ö/g, 'o').replace(/Ö/g, 'O').replace(/ç/g, 'c').replace(/Ç/g, 'C')
    .replace(/[^A-Za-z0-9-]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40);
}
/** Telefon uygulaması tutanağı A4 PDF'e çevirir; 'gonder' → paylaş menüsü (WhatsApp, e-posta, SMS…), 'ac' → PDF görüntüleyici */
function pdfIste(islem) {
  if (!T) return;
  if (!UYGULAMA) { window.print(); return; }
  const ad = 'HM_Tutanak_' + ascii(T.no) + (T.firma ? '_' + ascii(T.firma) : '') + '.pdf';
  const konu = tire('HM Korozyon Saha Tutanağı № ' + T.no + (T.firma ? ' - ' + T.firma : ''));
  const metin = tire('HM Korozyon - Saha Tutanağı № ' + T.no + (T.firma ? '\nFirma: ' + T.firma : '') +
    '\nİş: ' + T.isNo + (T.isAd ? ' - ' + T.isAd : '') + '\nTarih: ' + T.bas + (T.bit !== T.bas ? ' - ' + T.bit : '') +
    '\nDüzenleyen: ' + (T.duzenleyen && T.duzenleyen.ad || '') + '\nDoğrulama kodu: ' + T.kod);
  bilgi('PDF hazırlanıyor…', 20000);
  const s = $('sayfa'); s.style.transform = ''; s.style.marginLeft = ''; s.style.marginBottom = ''; boslukAyarla();
  try { window.HMAndroid.pdf(ad, islem, konu, metin); } catch (e) { bilgi('PDF oluşturulamadı: ' + e.message); }
}
window.pdfSonuc = (ok, m) => { bilgi(ok ? 'PDF hazır.' : 'PDF oluşturulamadı: ' + m, 4000); olcekle(); };

async function yukle() {
  const q = new URLSearchParams(location.search);
  const no = q.get('no'), k = q.get('k');
  if (!no || !k) { $('durum').textContent = 'Tutanak numarası veya doğrulama kodu eksik.'; return; }
  try {
    const r = await fetch(window.HM_API, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: 'appTutanakVeri', args: [no, k] }) });
    const j = JSON.parse(await r.text());
    if (!j.ok) throw new Error(j.hata || 'Sunucu hatası');
    ciz(j.sonuc);
  } catch (e) {
    $('durum').textContent = 'Tutanak açılamadı: ' + ((e && e.message) || e);
  }
}

function ciz(t) {
  T = t;
  document.title = tire('Tutanak ' + t.no + ' - ' + (t.firma || t.isNo));
  const unvan = tire(t.unvan || '');
  const ad = unvan.indexOf('HM KOROZYON') === 0 ? 'HM KOROZYON' : unvan.split(' ').slice(0, 2).join(' ');
  const kalan = unvan.slice(ad.length).trim();
  const i = kalan.indexOf(' SANAYİ');
  const alt1 = i > 0 ? kalan.slice(0, i) : kalan, alt2 = i > 0 ? kalan.slice(i + 1) : '';
  const isaret = k => '<span class="kutu">' + ((t.turler || []).indexOf(k) > -1 ? '✕' : '') + '</span>';
  const gun = String(t.olusturma || '').split(' ')[0];   // tutanağın yapıldığı gün

  /* ---------- ÜST: her sayfada tekrar eder ---------- */
  const ust =
    '<table class="ust"><tr>' +
      '<td class="logo" rowspan="2"><div class="logo-kutu"><img src="icons/icon-192.png" alt="HM"><div><div class="ad">' + esc(ad) + '</div>' +
        '<div class="alt">' + esc(alt1) + '<br>' + esc(alt2) + '</div></div></div></td>' +
      '<td class="tur">KATODİK KORUMA TUTANAĞI ' + isaret('KK') + '</td>' +
      '<td class="tur">TOPRAKLAMA TUTANAĞI ' + isaret('TOP') + '</td></tr>' +
      '<tr><td class="tarih">Başlama Tarihi: <b>' + esc(t.bas) + '</b> &nbsp; Bitiş Tarihi: <b>' + esc(t.bit) + '</b></td>' +
      '<td class="no"><span>№</span> <b>' + esc(t.no) + '</b></td></tr></table>' +
    '<table class="bilgiT"><colgroup><col style="width:19mm"><col style="width:52mm"><col style="width:20mm"><col style="width:41mm"><col></colgroup>' +
      '<tr><td class="et">FİRMA</td><td colspan="3" class="tek"><b>' + esc(t.firma) + '</b></td><td class="et">ADRES AÇIKLAMASI</td></tr>' +
      '<tr><td class="et">İLÇE</td><td class="tek">' + esc(t.ilce) + '</td><td class="et">SOKAK</td><td class="tek">' + esc(t.sokak) + '</td>' +
        '<td rowspan="3" class="adres"><div>' + esc(t.adres) + '</div></td></tr>' +
      '<tr><td class="et">MAHALLE</td><td class="tek">' + esc(t.mahalle) + '</td><td class="et">BİNA NO</td><td class="tek">' + esc(t.binaNo) + '</td></tr>' +
      '<tr><td class="et">CADDE</td><td class="tek">' + esc(t.cadde) + '</td><td class="et">GPS KODU</td><td class="tek">' + esc(t.gps) + '</td></tr>' +
    '</table>';

  /* ---------- ALT: imza + tarih, her sayfada tekrar eder ---------- */
  const alt =
    '<table class="imza"><tr><td class="bas">HM KOROZYON LTD. ŞTİ. ADINA</td><td class="bas">KONTROL</td><td class="bas">ONAY</td></tr>' +
      '<tr><td class="alan"><div class="kim">Ad Soyad: <b>' + esc(t.duzenleyen && t.duzenleyen.ad) + '</b><br>Görev: ' + esc(t.duzenleyen && t.duzenleyen.gorev) + '<br>İmza:</div></td>' +
      '<td class="alan"><div class="kim">Ad Soyad:<br>Görev / Firma:<br>İmza / Kaşe:</div></td>' +
      '<td class="alan"><div class="kim">Ad Soyad:<br>Görev / Firma:<br>İmza / Kaşe:</div></td></tr>' +
      '<tr><td class="trh">Tarih: <b>' + esc(gun) + '</b></td><td class="trh">Tarih: <b>' + esc(gun) + '</b></td><td class="trh">Tarih: <b>' + esc(gun) + '</b></td></tr></table>' +
    '<div class="dip">Düzenleyen: <b>' + esc(t.duzenleyen && t.duzenleyen.ad) + '</b>' + (t.duzenleyen && t.duzenleyen.gorev ? ' (' + esc(t.duzenleyen.gorev) + ')' : '') +
      ' - ' + esc(unvan) + '. Bu tutanak HM Saha sisteminden ' + esc(t.olusturma) + ' tarihinde üretilmiştir; asıl kayıt HM Korozyon\'dadır. ' +
      'Doğrulama kodu: <b>' + esc(t.kod) + '</b> · Tutanak № ' + esc(t.no) + '</div>';

  /* ---------- GÖVDE ---------- */
  const isler = (t.isler || []).map(x => '<li>' + esc(x.tanim) + ' - <b>' + esc(sayi(x.miktar)) + ' ' + esc(birim(x.birim)) + '</b></li>');
  const aksama = (t.aksama || []).map(a => esc(a.tarih + ': ' + a.durum + (a.neden ? ' - ' + a.neden : '') + (a.saat !== '' ? ' (' + sayi(a.saat) + ' saat kayıp)' : '')));
  const olcumYaz = t.olcumYaz !== false && (t.olcum || []).length > 0;   // seçilmediyse bölüm hiç yok
  // ölçümler nokta nokta (aynı noktanın ON / OFF / AC değerleri tek satırda); satır satır sayfaya bölünebilir
  const ogrup = {}, osira = [];
  (olcumYaz ? t.olcum : []).forEach(o => {
    const a = [o.tarih, o.nokta, o.ref].join('|');
    if (!ogrup[a]) { ogrup[a] = { nokta: o.nokta, ref: o.ref, tarih: o.tarih, d: [] }; osira.push(a); }
    ogrup[a].d.push(esc(String(o.kod).replace(' potansiyel', '')) + ' <b>' + esc(sayi(o.deger)) + ' ' + esc(o.birim) + '</b>');
  });
  const olcumSatir = osira.map(a => { const g = ogrup[a];
    return '<tr><td class="onok">' + esc(g.nokta || '-') + (t.bas !== t.bit ? '<br><small>' + esc(g.tarih) + '</small>' : '') + '</td>' +
      '<td>' + g.d.join(' &nbsp;·&nbsp; ') + (g.ref ? ' <span class="oref">(' + esc(g.ref) + ')</span>' : '') + '</td></tr>'; }).join('');
  const m = t.malzeme || [];
  const satir = Math.max(10, Math.ceil(m.length / 2));
  let malz = '';
  for (let r = 0; r < satir; r++) {       // satır satır: sol, sağ, sonraki satır (sayfa geçişinde sıra bozulmaz)
    const h = x => x ? '<td>' + esc(x.tanim) + '</td><td>' + esc(birim(x.birim)) + '</td><td class="s">' + esc(sayi(x.miktar)) + '</td>' : '<td></td><td></td><td></td>';
    malz += '<tr>' + h(m[2 * r]) + h(m[2 * r + 1]) + '</tr>';
  }
  const govde =
    '<table><tr><td class="bant">YAPILAN İŞ / KROKİ</td></tr>' +
      '<tr><td class="yapilan">' +
        (t.baslik ? '<h3>' + esc(t.baslik) + '</h3>' : '') +
        (isler.length ? '<ul class="liste">' + isler.join('') + '</ul>' : '') +
        '<div class="bilgi"><b>İş:</b> ' + esc(t.isNo + (t.isAd ? ' - ' + t.isAd : '')) +
          '<br><b>Çalışan personel:</b> ' + esc((t.personel || []).join(', ')) + ' &nbsp; <b>Çalışma günü:</b> ' + esc(t.gun) +
          (aksama.length ? '<br><b>Aksama:</b> ' + aksama.join(' · ') : '') +
          (t.aciklama ? '<br><b>Açıklama:</b> ' + esc(t.aciklama).replace(/\n/g, '<br>') : '') + '</div>' +
      '</td></tr>' +
    '</table>' +
    (olcumYaz ? '<table class="olcT"><colgroup><col style="width:30mm"><col></colgroup>' +
      '<thead><tr><th colspan="2">ÖLÇÜM DEĞERLERİ</th></tr></thead><tbody>' + olcumSatir + '</tbody></table>' : '') +
    '<table class="malz"><colgroup><col style="width:34%"><col style="width:7%"><col style="width:9%"><col style="width:34%"><col style="width:7%"><col style="width:9%"></colgroup>' +
      '<thead><tr><th>MALZEME CİNSİ</th><th>BİRİM</th><th>MİKTAR</th><th>MALZEME CİNSİ</th><th>BİRİM</th><th>MİKTAR</th></tr></thead>' +
      '<tbody>' + malz + '</tbody></table>';

  $('sayfa').innerHTML =
    '<div class="filigran"><img src="filigran.png" alt=""></div>' +
    (t.durum === 'İPTAL' ? '<div class="iptal"><span>İPTAL</span></div>' : '') +
    '<div class="bolum ustSabit" id="ustB">' + ust + '</div>' +
    '<table class="kalip">' +
      '<thead><tr><td><div class="bosluk" id="ustBosluk"></div></td></tr></thead>' +
      '<tfoot><tr><td><div class="bosluk" id="altBosluk"></div></td></tr></tfoot>' +
      '<tbody><tr><td>' + govde + '</td></tr></tbody></table>' +
    '<div class="bolum altSabit" id="altB">' + alt + '</div>';

  // yazdırmada üst/alt bölümler sabit (her sayfada aynı yer); gövde onların arasına sığdırılır
  const st = document.createElement('style');
  st.textContent = '@page { @bottom-left { content: "HM Korozyon · Saha Tutanağı № ' + String(t.no).replace(/["\\]/g, '') +
    ' · Doğrulama ' + String(t.kod).replace(/["\\]/g, '') + '"; font: 7pt Arial, sans-serif; color: #555; } ' +
    '@bottom-right { content: "Sayfa " counter(page) " / " counter(pages); font: bold 8pt Arial, sans-serif; color: #1d2b78; } }';
  document.head.appendChild(st);

  const msj = encodeURIComponent(tire('HM Korozyon - Saha Tutanağı № ' + t.no + '\n' + (t.firma ? 'Firma: ' + t.firma + '\n' : '') +
    'İş: ' + t.isNo + (t.isAd ? ' - ' + t.isAd : '') + '\nTarih: ' + t.bas + (t.bit !== t.bas ? ' - ' + t.bit : '') +
    '\nDüzenleyen: ' + (t.duzenleyen && t.duzenleyen.ad || '') + '\nTutanağı görmek / yazdırmak için: ') + location.href);
  $('gWa').href = 'https://wa.me/?text=' + msj;
  $('gSms').href = 'sms:?body=' + msj;
  $('gEp').href = 'mailto:?subject=' + encodeURIComponent('HM Korozyon Saha Tutanağı № ' + t.no) + '&body=' + msj;
  if (!UYGULAMA) ['gWa', 'gEp'].concat(/Android|iPhone|iPad/i.test(navigator.userAgent) ? ['gSms'] : []).forEach(id => { $(id).style.display = 'inline-block'; });

  $('durum').style.display = 'none';
  $('sayfa').style.display = 'block';
  boslukAyarla();
  olcekle();
  // uygulamadan "PDF gönder / PDF aç" ile gelindiyse: resimler yüklenince PDF'i hemen hazırla
  const istek = new URLSearchParams(location.search).get('pdf');
  if (UYGULAMA && (istek === 'gonder' || istek === 'ac')) {
    const resimler = Array.from(document.querySelectorAll('#sayfa img'));
    Promise.all(resimler.map(r => r.complete ? 1 : new Promise(ok => { r.onload = r.onerror = ok; })))
      .then(() => setTimeout(() => pdfIste(istek), 500));
  }
}
/** Yazdırmada sabit üst/alt bölümlerin yüksekliği kadar her sayfada boşluk bırakılır (thead/tfoot her sayfada tekrar eder). */
function boslukAyarla() {
  const s = $('sayfa'), eski = s.style.transform; s.style.transform = '';
  $('ustBosluk').style.height = ($('ustB').offsetHeight + 4) + 'px';
  $('altBosluk').style.height = ($('altB').offsetHeight + 4) + 'px';
  s.style.transform = eski;
}
function olcekle() {   // telefonda A4 sayfayı ekrana sığdır
  const s = $('sayfa');
  s.style.transform = ''; s.style.marginLeft = ''; s.style.marginBottom = '';
  const w = window.innerWidth - 16, a4 = s.offsetWidth;
  if (a4 > w) { const k = w / a4; s.style.transform = 'scale(' + k + ')'; s.style.transformOrigin = 'top left'; s.style.marginLeft = '8px'; s.style.marginBottom = (-(1 - k) * s.offsetHeight) + 'px'; }
}
window.addEventListener('resize', () => { if ($('ustB')) olcekle(); });
window.addEventListener('beforeprint', () => { const s = $('sayfa'); s.style.transform = ''; s.style.marginLeft = ''; s.style.marginBottom = ''; boslukAyarla(); });
window.addEventListener('afterprint', olcekle);
yukle();
</script>
